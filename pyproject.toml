[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hhru-bot"
version = "0.1.0"
description = "CLI для поиска вакансий, откликов и поднятия резюме на hh.ru (Playwright)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "axisrow" }]
dependencies = [
    "playwright>=1.59.0",
    "PyYAML>=6.0",
    "browser-cookie3>=0.20.1",
]

[project.scripts]
hhru-bot = "hhru_bot.cli:main"
hhru = "hhru_bot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
]
# AI/LLM-функциональность (issue #230). Не входит в базовые dependencies —
# бот работает без LLM; установите группу [ai] только когда нужна AI-интеграция:
#   pip install -e '.[ai]'
# hermes-agent-axisrow импортируется лениво внутри hhru_bot.ai.llm_client,
# поэтому отсутствие пакета не ломает импорт остального кода. openai SDK
# приходит транзитивно (форк пинит openai==2.24.0 — версию с Responses API);
# отдельно openai больше не указываем.
ai = [
    "hermes-agent-axisrow>=0.20.1.2",
]
# Google Calendar OAuth/event command (#64). Kept optional so the hh.ru CLI does
# not require Google dependencies and cannot create events implicitly.
calendar = [
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not live_write and not live_write_danger and not live_read'"
markers = [
    "unit: чистая логика без сети",
    "integration: связки модулей на моках и фикстурах",
    "smoke: быстрая проверка сборки или CLI",
    "e2e: сквозной путь на фикстурах без сети",
    "live_read: чтение живого hh.ru без мутаций",
    "live_write: обратимая мутация своего аккаунта, незаметная посторонним",
    "live_write_danger: необратимая мутация или действие, видимое посторонним; требует подтверждения",
]
