# Скопируйте этот файл в data/config.yaml и заполните своими данными.
# mkdir -p data && cp config/config.example.yaml data/config.yaml
#
# Этот файл — версионируемый шаблон формата, он лежит в config/ и в git.
# Реальный конфиг (как БД, сессия и логи) — изменяемые данные, они живут в
# data/, которая целиком в .gitignore одной строкой (#133).

account:
  # Путь резолвится ОТНОСИТЕЛЬНО ЭТОГО файла конфига (data/config.yaml), не от
  # cwd. storage_state/ → data/storage_state/ → покрыто .gitignore (data/).
  # НЕ выносите сессию за пределы data/ (напр. через ../) — иначе секрет hh.ru
  # (cookies/localStorage) окажется вне игнора и сможет попасть в git-коммит.
  storage_state_file: storage_state/hh_session.json
  # user_agent опционален. Закомментирован/отсутствует — Playwright ставит свой
  # родной User-Agent. Раскомментируйте и впишите строку, только если hh.ru
  # требует конкретный UA. Хардкода Chrome/xxx в коде нет (см. #9).
  # user_agent: "Mozilla/5.0 ... Chrome/XXX Safari/537.36"

# AI/LLM-функциональность (issue #230) — ОПЦИОНАЛЬНО. TOP-LEVEL секция (как
# account). Раскомментируйте, только если нужна AI-функциональность
# (ранжирование/сопоставление резюме и т.п.).
#
# Требует optional-зависимости:  pip install -e '.[ai]'
#
# Наличие секции включает AI. Маршрутизация, provider/model и credentials
# принадлежат hermes-agent-axisrow (Responses API): они читаются из ~/.hermes
# (auth.json + конфиг Hermes), hhru их не задаёт и не переопределяет. Поля
# provider/model/base_url устарели и игнорируются — оставьте секцию пустой:
#
# ai: {}


throttle:
  min_delay_seconds: 8
  max_delay_seconds: 25
  daily_apply_limit: 40
  daily_bump_limit: 10

cover_letter_default: |
  Здравствуйте!

  Меня заинтересовала вакансия "{vacancy_title}" в компании {company_name}.
  Мой опыт и навыки соответствуют требованиям, буду рад обсудить детали.

  С уважением

resumes:
  - id: "resume-name-1"
    resume_url: "https://hh.ru/resume/XXXXXXXXXXXXXXXXXXXXXXXX"
    search:
      text: "python developer"
      area: 1
      salary_from: 200000
      experience: "between3And6"
      schedule: "remote"
      exclude_employers:
        - "Компания А"
        - "Компания Б"
      exclude_keywords:
        - "1С"
        - "холодные звонки"
      # Опционально (issue #15): буст за совпадение ключевых слов в title.
      must_have:
        - "python"
        - "django"
      nice_to_have:
        - "docker"
        - "kubernetes"
    # Опционально (issue #15): веса факторов ранжирования. При отсутствии
    # секции используются дефолтные веса ниже.
    scoring:
      weights:
        must_have: 2.0        # буст за каждое must_have-совпадение в title
        nice_to_have: 1.0     # буст за каждое nice_to_have-совпадение
        exclude_keyword: -3.0 # штраф за стоп-слово в title
        text_match: 1.0       # буст × доля совпавших токенов filters.text
    # Опционально (issue #17): профиль кандидата для AI-генерации писем под
    # конкретную вакансию. Включает AI ТОЛЬКО ВМЕСТЕ с топ-левел секцией ai
    # (см. выше): нет ai или нет ai_profile → отклик идёт со статичным шаблоном
    # cover_letter (поведение не меняется). При сбое LLM письмо откатывается на
    # шаблон автоматически (variant 'ai_fallback' пишется в историю для A/B).
    # ai_profile:
    #   summary: "Бэкенд-разработчик с фокусом на высоконагруженные сервисы"
    #   skills: ["python", "django", "postgresql", "docker"]
    #   highlights:
    #     - "Поднял throughput API в 3 раза"
    #     - "Выстроил CI/CD с нуля"
    #   desired_role: "Senior Python Developer"
    #   tone: formal   # formal | friendly (по умолчанию formal)
    #   # few-shot стиль (issue #96): образцы прошлых писём — LLM имитирует ваш
    #   # тон/структуру. Опционально (пусто = без few-shot, поведение #17).
    #   # Поддерживают рандомизацию {a|b|c} (#86). При сбое LLM — fallback на
    #   # cover_letter (variant 'ai_fallback').
    #   cover_letter_examples:
    #     - "Здравствуйте! Пишу как бэкенд-разработчик, откликаюсь на вакансию."
    #     - "Добрый день. Мой опыт в {python|django} релевантен вашей задаче."
    cover_letter: null

  - id: "resume-name-2"
    resume_url: "https://hh.ru/resume/YYYYYYYYYYYYYYYYYYYYYYYY"
    search:
      text: "data analyst"
      area: 1
      salary_from: null
      experience: null
      schedule: null
      exclude_employers: []
      exclude_keywords: []
    cover_letter: null
