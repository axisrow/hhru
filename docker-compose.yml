services:
  hhru:
    build: .
    init: true
    restart: unless-stopped
    # The image entrypoint is hhru; this service command is a shell loop.
    entrypoint: []
    environment:
      HHRU_ACCOUNT: default
    volumes:
      - ./data:/app/data
    command:
      - sh
      - -c
      - >-
        while true; do
          hhru --account "$${HHRU_ACCOUNT:-default}" --headless run;
          sleep 14400;
        done
