      note: 'Live WRITE test 2026-08-30 (#782/#787/PR #856, 17-resume account, draft target resume): on an account with more
        than 2 resumes the "Резюме с этим местом работы" panel collapses to 2 visible rows behind a "Развернуть<span>ещё N</span>"
        button. Live DOM trace found the button''s lowest common ancestor with the panel''s <h3> heading is 6 DIV levels up
        (a different, deeper container than the 2-level ancestor that holds the checkboxes themselves), so it is addressed
        as a page-wide control rather than scoped through the h3 — confirmed unique (count()==1) on the live shared-editor
        screen, where it is the only "Развернуть"-labeled button. **#858 RESOLVED (live drill 2026-08-30, no save)**: the
        PR #856 activation instability is a React HYDRATION WINDOW — the server-rendered button is visible/enabled ~1.5s before
        React attaches its listeners; during that window the element carries no __reactFiber/__reactProps instance keys and
        every click (Playwright actionability all pass, elementFromPoint on the button''s own label) is silently swallowed.
        Measured on repeated live loads: clicks at 1.6-2.3s after load failed, the first click after both keys appeared (~2.5s)
        succeeded every time. EXPERIENCE_RESUME_PANEL_EXPAND selector itself was correct all along; _reconcile_experience_resume_panel
        now waits for the fiber+props readiness signal before clicking and retries with confirmation (button must disappear)
        as defence in depth.'
